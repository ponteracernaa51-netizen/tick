<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS 60-Day Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:       #0D1525;
  --navy-mid:   #172035;
  --navy-light: #1F2E48;
  --card:       #182035;
  --border:     #243352;
  --white:      #EEF2FF;
  --muted:      #607090;
  --gold:       #F5C842;
  --teal:       #4ECDC4;
  --rose:       #FF6B8A;
  --purple:     #9B7FD4;
  --orange:     #FFA564;
  --green:      #5DD67F;
}
body { background: var(--navy); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; }
h1,h2,h3,h4 { font-family: 'Space Grotesk', sans-serif; }

/* ── Screens ── */
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ══════════════════ LOGIN ══════════════════ */
#loginScreen {
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
  flex-direction: column;
}
#loginScreen.active { display: flex; }
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 32px;
  width: 100%;
  max-width: 400px;
}
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo h1 { font-size: 1.8rem; }
.login-logo h1 span { color: var(--gold); }
.login-logo p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.tabs { display: flex; background: var(--navy-light); border-radius: 10px; margin-bottom: 24px; }
.tab-btn {
  flex: 1; padding: 9px; border: none; background: transparent; color: var(--muted);
  font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; font-weight: 600;
  border-radius: 10px; cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: var(--gold); color: var(--navy); }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.field input {
  width: 100%; padding: 11px 14px;
  background: var(--navy-mid); border: 1px solid var(--border);
  border-radius: 10px; color: var(--white); font-size: 0.95rem; font-family: 'Inter', sans-serif;
  transition: border-color 0.2s;
}
.field input:focus { outline: none; border-color: var(--teal); }
.submit-btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  background: var(--gold); color: var(--navy);
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1rem;
  cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
}
.submit-btn:hover { opacity: 0.9; }
.auth-error { color: var(--rose); font-size: 0.83rem; margin-top: 10px; text-align: center; min-height: 18px; }

/* ══════════════════ APP SHELL ══════════════════ */
#appScreen { display: none; flex-direction: column; }
#appScreen.active { display: flex; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; background: var(--card);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
}
.topbar-brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; }
.topbar-brand span { color: var(--gold); }
.topbar-user { display: flex; align-items: center; gap: 10px; }
.user-badge {
  background: var(--navy-light); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px;
  font-size: 0.82rem; font-weight: 600; font-family: 'Space Grotesk', sans-serif;
}
.logout-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-size: 0.78rem; padding: 5px 10px; border-radius: 8px; cursor: pointer;
  transition: all 0.2s; font-family: 'Inter', sans-serif;
}
.logout-btn:hover { border-color: var(--rose); color: var(--rose); }
.nav-tabs {
  display: flex; background: var(--card);
  border-bottom: 1px solid var(--border);
}
.nav-tab {
  flex: 1; padding: 12px 8px; border: none; background: transparent;
  color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.82rem;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
  border-bottom: 2px solid transparent;
}
.nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-content { display: none; padding: 20px 16px 60px; max-width: 600px; margin: 0 auto; width: 100%; }
.tab-content.active { display: block; }

/* ══════════════════ CHECKLIST ══════════════════ */
.date-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 8px;
}
.nav-arrow {
  background: var(--card); border: 1px solid var(--border); color: var(--white);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  font-size: 1rem; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s; flex-shrink: 0;
}
.nav-arrow:hover { background: var(--navy-light); }
.date-center { text-align: center; flex: 1; }
.date-main { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1rem; }
.day-badge {
  display: inline-block; font-size: 0.68rem; font-weight: 700;
  padding: 2px 9px; border-radius: 20px; margin-left: 6px;
  vertical-align: middle; letter-spacing: .4px;
}
.badge-odd { background: var(--teal); color: var(--navy); }
.badge-even { background: var(--rose); color: #fff; }
.today-link {
  display: block; font-size: 0.75rem; color: var(--muted); cursor: pointer;
  margin-top: 2px; text-decoration: underline; text-underline-offset: 2px;
}
.today-link:hover { color: var(--teal); }

.progress-wrap { margin-bottom: 22px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 7px; }
.prog-bar { background: var(--navy-light); border-radius: 8px; height: 7px; overflow: hidden; }
.prog-fill {
  height: 100%; border-radius: 8px;
  background: linear-gradient(90deg, var(--teal), var(--gold));
  transition: width 0.4s ease;
}

/* Section card — single-tick style */
.sec-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; cursor: pointer;
  transition: border-color 0.2s;
  user-select: none;
}
.sec-card:hover { border-color: var(--muted); }
.sec-card.done { border-color: var(--teal); opacity: 0.7; }
.sec-icon {
  width: 40px; height: 40px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem; flex-shrink: 0;
}
.ic-reading   { background: rgba(78,205,196,.15); }
.ic-listening { background: rgba(245,200,66,.15); }
.ic-speaking  { background: rgba(255,107,138,.15); }
.ic-writing   { background: rgba(155,127,212,.15); }
.ic-grammar   { background: rgba(255,165,100,.15); }
.ic-vocab     { background: rgba(93,214,127,.15); }
.sec-info { flex: 1; }
.sec-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 600; }
.sec-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.big-check {
  width: 28px; height: 28px; border-radius: 8px;
  border: 2px solid var(--muted); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-size: 0; color: var(--navy); font-weight: 900;
}
.sec-card.done .big-check {
  background: var(--teal); border-color: var(--teal); font-size: 1rem;
}

.complete-bar {
  display: none; background: linear-gradient(135deg,#0d2a1f,#0d1f2a);
  border: 1px solid var(--teal); border-radius: 14px;
  padding: 18px; text-align: center; margin-bottom: 16px;
}
.complete-bar.show { display: block; }
.complete-bar h3 { color: var(--teal); font-size: 1rem; margin: 8px 0 4px; }
.complete-bar p { font-size: 0.82rem; color: var(--muted); }

/* ══════════════════ CALENDAR ══════════════════ */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.cal-month { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-dow {
  text-align: center; font-size: 0.7rem; color: var(--muted);
  font-family: 'Space Grotesk', sans-serif; font-weight: 600;
  padding: 4px 0 8px;
}
.cal-cell {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 0.82rem; position: relative; cursor: default;
}
.cal-cell.empty { background: transparent; }
.cal-cell.today { border: 2px solid var(--gold); }
.cal-cell.full { background: rgba(78,205,196,.25); color: var(--teal); font-weight: 600; }
.cal-cell.partial { background: rgba(245,200,66,.15); color: var(--gold); }
.cal-cell.none { background: var(--navy-light); color: var(--muted); }
.cal-cell .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--teal); position: absolute; bottom: 5px;
}
.cal-legend { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); }
.legend-box { width: 14px; height: 14px; border-radius: 4px; }

/* ══════════════════ STATS ══════════════════ */
.stats-header { margin-bottom: 24px; }
.stats-header h2 { font-size: 1.2rem; margin-bottom: 4px; }
.stats-header p { font-size: 0.82rem; color: var(--muted); }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 18px; margin-bottom: 12px;
}
.stat-card h4 { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
.user-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--border);
}
.user-row:last-child { border-bottom: none; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--navy-light); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--teal);
  flex-shrink: 0;
}
.user-name { font-size: 0.9rem; font-weight: 600; font-family: 'Space Grotesk', sans-serif; flex: 1; }
.user-streak { font-size: 0.8rem; color: var(--gold); }
.daily-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.daily-row:last-child { border-bottom: none; }
.daily-date { font-size: 0.82rem; min-width: 90px; color: var(--muted); font-family: 'Space Grotesk', sans-serif; }
.daily-bar-wrap { flex: 1; background: var(--navy-light); border-radius: 6px; height: 7px; overflow: hidden; }
.daily-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg,var(--teal),var(--gold)); }
.daily-pct { font-size: 0.78rem; min-width: 36px; text-align: right; font-family: 'Space Grotesk', sans-serif; }
.empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.9rem; }

/* ── Utility ── */
.loading { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="loginScreen" class="screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>IELTS <span>60-Day</span></h1>
      <p>Track your prep. Hit your band score.</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchAuthTab('login')">Sign in</button>
      <button class="tab-btn" onclick="switchAuthTab('register')">Register</button>
    </div>
    <div id="loginForm">
      <div class="field"><label>Username</label><input type="text" id="loginUser" placeholder="your username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="submit-btn" onclick="doLogin()">Sign in</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="field"><label>Username</label><input type="text" id="regUser" placeholder="choose a username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="regPass" placeholder="choose a password" autocomplete="new-password"></div>
      <button class="submit-btn" onclick="doRegister()">Create account</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="appScreen" class="screen">
  <div class="topbar">
    <div class="topbar-brand">IELTS <span>Tracker</span></div>
    <div class="topbar-user">
      <div class="user-badge" id="topUser">—</div>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('checklist')">📋 Checklist</button>
    <button class="nav-tab" onclick="switchTab('calendar')">📅 Calendar</button>
    <button class="nav-tab" onclick="switchTab('stats')">📊 Stats</button>
  </div>

  <!-- ── Checklist tab ── -->
  <div class="tab-content active" id="tab-checklist">
    <div class="date-nav">
      <button class="nav-arrow" onclick="changeDay(-1)">‹</button>
      <div class="date-center">
        <div class="date-main" id="dateDisplay">—</div>
        <span class="today-link" onclick="goToday()">Go to today</span>
      </div>
      <button class="nav-arrow" onclick="changeDay(1)">›</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Today's progress</span>
        <span id="progLabel">0 / 0</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="complete-bar" id="completeBanner">
      <div style="font-size:1.8rem">🎉</div>
      <h3>Day complete!</h3>
      <p>Every completed day is a step closer to your target band score.</p>
    </div>
    <div id="sectionsWrap"></div>
  </div>

  <!-- ── Calendar tab ── -->
  <div class="tab-content" id="tab-calendar">
    <div class="cal-nav">
      <button class="nav-arrow" onclick="calChangeMonth(-1)">‹</button>
      <div class="cal-month" id="calMonthLabel">—</div>
      <button class="nav-arrow" onclick="calChangeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <div class="legend-item"><div class="legend-box" style="background:rgba(78,205,196,.25)"></div>All done</div>
      <div class="legend-item"><div class="legend-box" style="background:rgba(245,200,66,.15)"></div>Partial</div>
      <div class="legend-item"><div class="legend-box" style="background:var(--navy-light)"></div>Not started</div>
    </div>
  </div>

  <!-- ── Stats tab ── -->
  <div class="tab-content" id="tab-stats">
    <div class="stats-header">
      <h2>Overall Statistics</h2>
      <p>Completion data across all users.</p>
    </div>
    <div id="statsWrap"><div class="loading">Loading stats…</div></div>
  </div>
</div>

<script>
// ══════════════════════════════════
//  CONFIG & STATE
// ══════════════════════════════════
const API = '';  // same origin
let token = localStorage.getItem('ielts_token') || '';
let currentUser = localStorage.getItem('ielts_user') || '';
let startDate = localStorage.getItem('ielts_start') || '';
let viewDate = new Date();
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calendarData = {};
let checksCache = {}; // date -> checks object

// ══════════════════════════════════
//  TASK DEFINITIONS
// ══════════════════════════════════
const SECTIONS_ODD = [
  { id:'reading',   icon:'📖', iconCls:'ic-reading',   title:'Reading',    sub:'Thematic — 8 topics (complete all)' },
  { id:'listening', icon:'🎧', iconCls:'ic-listening',  title:'Listening',  sub:'Thematic — 5 topics (complete all)' },
];
const SECTIONS_EVEN = [
  { id:'speaking', icon:'🗣️', iconCls:'ic-speaking', title:'Speaking',  sub:'All 3 parts (Part 1 · 2 · 3)' },
  { id:'writing',  icon:'✍️',  iconCls:'ic-writing',  title:'Writing',   sub:'Task 1 + Task 2' },
  { id:'grammar',  icon:'📐', iconCls:'ic-grammar',  title:'Grammar',   sub:'Rule study + practice' },
];
const SECTION_VOCAB = { id:'vocab', icon:'💬', iconCls:'ic-vocab', title:'Vocabulary', sub:'20 new words — every day' };

function getSections(dayNum) {
  const base = dayNum % 2 !== 0 ? SECTIONS_ODD : SECTIONS_EVEN;
  return [...base, SECTION_VOCAB];
}

// ══════════════════════════════════
//  AUTH
// ══════════════════════════════════
function switchAuthTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display = tab==='register'?'block':'none';
  document.getElementById('authError').textContent = '';
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if(!username||!password) { showAuthErr('Fill in both fields.'); return; }
  try {
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const d = await r.json();
    if(!r.ok) { showAuthErr(d.error); return; }
    saveSession(d);
  } catch { showAuthErr('Could not reach server.'); }
}

async function doRegister() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  if(!username||!password) { showAuthErr('Fill in both fields.'); return; }
  if(password.length < 4) { showAuthErr('Password must be at least 4 characters.'); return; }
  try {
    const r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const d = await r.json();
    if(!r.ok) { showAuthErr(d.error); return; }
    saveSession(d);
  } catch { showAuthErr('Could not reach server.'); }
}

function saveSession(d) {
  token = d.token; currentUser = d.username; startDate = d.startDate;
  localStorage.setItem('ielts_token', token);
  localStorage.setItem('ielts_user', currentUser);
  localStorage.setItem('ielts_start', startDate);
  enterApp();
}

function doLogout() {
  token=''; currentUser=''; startDate='';
  localStorage.removeItem('ielts_token');
  localStorage.removeItem('ielts_user');
  localStorage.removeItem('ielts_start');
  checksCache = {};
  showScreen('loginScreen');
}

function showAuthErr(msg) { document.getElementById('authError').textContent = msg; }

// ══════════════════════════════════
//  SCREENS & TABS
// ══════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='calendar') renderCalendar();
  if(tab==='stats') renderStats();
}

function enterApp() {
  showScreen('appScreen');
  document.getElementById('topUser').textContent = currentUser;
  viewDate = new Date();
  loadAndRenderChecklist();
}

// ══════════════════════════════════
//  CHECKLIST
// ══════════════════════════════════
function dateKey(d) { return d.toISOString ? d.toISOString().slice(0,10) : d; }

function dayNumber(d) {
  if(!startDate) return 1;
  const start = new Date(startDate);
  return Math.floor((new Date(dateKey(d)) - start) / 86400000) + 1;
}

async function loadAndRenderChecklist() {
  const dk = dateKey(viewDate);
  if(!checksCache[dk]) {
    try {
      const r = await fetch(`/api/checks/${dk}`, {headers:{Authorization:'Bearer '+token}});
      checksCache[dk] = await r.json();
    } catch { checksCache[dk] = {}; }
  }
  renderChecklist();
}

function renderChecklist() {
  const dk = dateKey(viewDate);
  const dn = dayNumber(viewDate);
  const checks = checksCache[dk] || {};
  const sections = getSections(dn);
  const isOdd = dn % 2 !== 0;

  // Date display
  const opts = {weekday:'short',month:'short',day:'numeric'};
  const dateStr = viewDate.toLocaleDateString('en-US',opts);
  document.getElementById('dateDisplay').innerHTML =
    `${dateStr} <span class="day-badge ${isOdd?'badge-odd':'badge-even'}">${isOdd?'ODD':'EVEN'}</span>`;

  // Progress
  const total = sections.length;
  const done = sections.filter(s => checks[s.id]).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progLabel').textContent = `${done} / ${total}`;
  document.getElementById('completeBanner').classList.toggle('show', done===total&&total>0);

  // Sections
  const wrap = document.getElementById('sectionsWrap');
  wrap.innerHTML = '';
  sections.forEach(sec => {
    const isDone = !!checks[sec.id];
    const card = document.createElement('div');
    card.className = 'sec-card' + (isDone ? ' done' : '');
    card.innerHTML = `
      <div class="sec-icon ${sec.iconCls}">${sec.icon}</div>
      <div class="sec-info">
        <div class="sec-title">${sec.title}</div>
        <div class="sec-sub">${sec.sub}</div>
      </div>
      <div class="big-check">${isDone ? '✓' : ''}</div>`;
    card.onclick = () => toggleSection(sec.id);
    wrap.appendChild(card);
  });
}

async function toggleSection(secId) {
  const dk = dateKey(viewDate);
  const checks = checksCache[dk] || {};
  checks[secId] = !checks[secId];
  checksCache[dk] = checks;
  renderChecklist();
  // Save to server
  try {
    await fetch(`/api/checks/${dk}`,{
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify(checks)
    });
    // Invalidate calendar cache
    calendarData = {};
  } catch {}
}

function changeDay(delta) {
  viewDate = new Date(viewDate.getTime() + delta*86400000);
  loadAndRenderChecklist();
}
function goToday() { viewDate = new Date(); loadAndRenderChecklist(); }

// ══════════════════════════════════
//  CALENDAR
// ══════════════════════════════════
async function renderCalendar() {
  if(!Object.keys(calendarData).length) {
    try {
      const r = await fetch('/api/calendar',{headers:{Authorization:'Bearer '+token}});
      calendarData = await r.json();
    } catch { calendarData = {}; }
  }

  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonthLabel').textContent = `${monthNames[calMonth]} ${calYear}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  // Day-of-week headers
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
    const el = document.createElement('div');
    el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = dateKey(new Date());

  for(let i=0;i<firstDay;i++) {
    const el = document.createElement('div'); el.className='cal-cell empty'; grid.appendChild(el);
  }
  for(let d=1;d<=daysInMonth;d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'cal-cell';
    if(dateStr===todayStr) el.classList.add('today');
    const data = calendarData[dateStr];
    if(data) {
      if(data.done===data.total && data.total>0) el.classList.add('full');
      else if(data.done>0) el.classList.add('partial');
      else el.classList.add('none');
    } else {
      const dn = dayNumber(new Date(dateStr));
      if(dn>=1 && dn<=60 && dateStr<todayStr) el.classList.add('none');
    }
    el.textContent = d;
    if(data && data.done>0) { const dot=document.createElement('div'); dot.className='dot'; el.appendChild(dot); }
    grid.appendChild(el);
  }
}

function calChangeMonth(delta) {
  calMonth += delta;
  if(calMonth<0) { calMonth=11; calYear--; }
  if(calMonth>11) { calMonth=0; calYear++; }
  renderCalendar();
}

// ══════════════════════════════════
//  STATS
// ══════════════════════════════════
async function renderStats() {
  const wrap = document.getElementById('statsWrap');
  wrap.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const r = await fetch('/api/stats',{headers:{Authorization:'Bearer '+token}});
    const data = await r.json();

    let html = '';

    // Users leaderboard
    html += `<div class="stat-card">
      <h4>All users — streak leaderboard</h4>`;
    if(!data.users.length) {
      html += `<div class="empty-state">No users yet.</div>`;
    } else {
      const sorted = [...data.users].sort((a,b)=>b.streak-a.streak);
      sorted.forEach((u,i) => {
        const initial = u.username[0].toUpperCase();
        html += `<div class="user-row">
          <div class="user-avatar">${initial}</div>
          <div class="user-name">${u.username}</div>
          <div class="user-streak">🔥 ${u.streak} day streak</div>
        </div>`;
      });
    }
    html += '</div>';

    // Daily completion chart
    html += `<div class="stat-card">
      <h4>Daily completion — all users</h4>`;
    const entries = Object.entries(data.byDate).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
    if(!entries.length) {
      html += `<div class="empty-state">No check data yet.</div>`;
    } else {
      entries.forEach(([date,d]) => {
        const pct = d.totalTasks ? Math.round(d.doneTasks/d.totalTasks*100) : 0;
        const label = new Date(date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
        html += `<div class="daily-row">
          <div class="daily-date">${label}</div>
          <div class="daily-bar-wrap"><div class="daily-bar-fill" style="width:${pct}%"></div></div>
          <div class="daily-pct" style="color:${pct===100?'var(--teal)':'var(--muted)'}">${pct}%</div>
        </div>`;
      });
    }
    html += '</div>';

    wrap.innerHTML = html;
  } catch { wrap.innerHTML = '<div class="empty-state">Could not load stats.</div>'; }
}
